[project]
name = "axler-lin-reg"
version = "0.1.0"
description = "An educational linear algebra library built alongside Axler's Linear Algebra Done Right"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sympy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linalg"]
